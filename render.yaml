services:
  - type: web
    name: taf-disti-desk
    runtime: node
    plan: starter
    buildCommand: npm_config_build_from_source=true npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: taf-disti-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/delivery.sqlite
