<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f4">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/taf-disti-desk.svg" type="image/svg+xml">
    <title>Reset password | TAF Disti Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/auth.css">
    <script src="/pwa.js" defer></script>
    <script src="/auth.js" defer></script>
  </head>
  <body>
    <div class="auth-shell">
      <header class="auth-topbar">
        <a class="auth-brand" href="/login">
          <span class="auth-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m3.5 7.8 8.5 4.4 8.5-4.4M12 12.4V21M7.5 5.3l9 4.6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          TAF Disti Desk
        </a>
        <div class="auth-topbar-actions"><span class="auth-topbar-note">Account recovery</span></div>
      </header>
      <main class="auth-content">
        <section class="auth-card">
          <div class="auth-eyebrow">ACCOUNT RECOVERY</div>
          <h1>Forgot your password?</h1>
          <p class="auth-copy">Enter the email address registered to your account. If it matches, we’ll send a secure link to choose a new password.</p>
          <form class="auth-form" data-auth-form data-action="forgot-password" data-endpoint="/api/auth/forgot-password">
            <label class="auth-field">Email address<input name="email" type="email" autocomplete="email" placeholder="you@company.com" maxlength="254" required autofocus></label>
            <div class="auth-message" data-auth-message role="alert" hidden></div>
            <button class="auth-submit" type="submit" data-original-label="Send reset link">Send reset link</button>
          </form>
          <div class="auth-card-footer"><a href="/login">Back to sign in</a></div>
        </section>
      </main>
      <footer class="auth-footer">TAF Disti Desk <span aria-hidden="true">·</span> Delivery tracker<br><span class="creator-credit">Created by Aamir Rahman · TAF Tech</span></footer>
    </div>
  </body>
</html>
