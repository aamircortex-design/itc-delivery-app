<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f4">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/taf-disti-desk.svg" type="image/svg+xml">
    <title>Sign in | TAF Disti Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/auth.css">
    <script src="/pwa.js" defer></script>
    <script src="/auth.js" defer></script>
  </head>
  <body>
    <div class="auth-shell">
      <header class="auth-topbar">
        <a class="auth-brand" href="/">
          <span class="auth-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m3.5 7.8 8.5 4.4 8.5-4.4M12 12.4V21M7.5 5.3l9 4.6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          TAF Disti Desk
        </a>
        <div class="auth-topbar-actions">
          <span class="auth-topbar-note">Delivery operations portal</span>
          <button class="install-app-button" data-install-app type="button" hidden>Install app</button>
        </div>
      </header>
      <main class="auth-content">
        <section class="auth-card">
          <div class="auth-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10.5" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
          <div class="auth-eyebrow">SECURE TEAM ACCESS</div>
          <h1>Welcome back.</h1>
          <p class="auth-copy">Sign in with the user ID and password provided by your administrator.</p>
          <form class="auth-form" data-auth-form data-endpoint="/api/auth/login">
            <label class="auth-field">User ID<input name="userId" type="text" autocomplete="username" placeholder="Enter your user ID" maxlength="64" required autofocus></label>
            <label class="auth-field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="128" required></label>
            <div class="auth-form-link"><a href="/forgot-password">Forgot password?</a></div>
            <div class="auth-message" data-auth-message role="alert" hidden></div>
            <button class="auth-submit" type="submit" data-original-label="Sign in">Sign in <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
          <div class="auth-card-footer"><span>New company?</span><a href="/company-setup">Create a workspace</a></div>
        </section>
      </main>
      <footer class="auth-footer">TAF Disti Desk <span aria-hidden="true">·</span> Delivery tracker<br><span class="creator-credit">Created by Aamir Rahman · TAF Tech</span></footer>
    </div>
  </body>
</html>
